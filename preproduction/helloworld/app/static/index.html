<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HelloWorld</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0c35a'/%3E%3Cpath d='M9 10h14v12H9z' fill='none' stroke='%231a1405' stroke-width='2.5'/%3E%3Cpath d='M13 14l6 2-6 2z' fill='%231a1405'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <header class="mobile-bar">
      <button class="btn ghost small" data-action="menu" aria-label="Menu">☰</button>
      <span class="brand-name">HelloWorld</span>
    </header>
    <aside id="sidebar" class="sidebar" aria-label="Navigation"></aside>
    <main class="main">
      <section id="view" class="view" tabindex="-1"></section>
      <div id="frames" class="frames" hidden></div>
    </main>
  </div>
  <footer id="activity" class="activity" aria-live="polite"></footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="drop" class="drop-overlay" hidden><div>Drop an Open Shot Designer <b>.osd</b> to add it to HelloWorld</div></div>
  <div id="lightbox" class="lightbox" hidden></div>
  <input id="file" type="file" accept=".osd" hidden>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
